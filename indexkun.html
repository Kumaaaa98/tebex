<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .recent-box {
      background-color: #17182b;
      border: 1px solid #232542;
      border-radius: 12px;
      padding: 16px;
      width: 290px;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .recent-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #5865f2; /* Azul estilo Obsilion/Discord */
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .recent-title svg {
      width: 18px;
      height: 18px;
      fill: #5865f2;
    }

    .heads-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .head-img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      image-rendering: pixelated;
      background-color: #0f101d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }

    .head-img:hover {
      transform: scale(1.2);
      border-color: #5865f2;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="recent-box">
    <div class="recent-title">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      COMPRAS RECIENTES
    </div>

    <div id="heads-container" class="heads-grid">
      <!-- Se llenan automáticamente -->
    </div>
  </div>

  <script>
    // Coloca tu Public Token si usas API Headless, o déjalo automático
    const PUBLIC_TOKEN = "PEGA_TU_PUBLIC_TOKEN_AQUI"; 

    const container = document.getElementById('heads-container');

    function renderPlayers(names) {
      container.innerHTML = '';
      names.slice(0, 21).forEach(name => {
        const img = document.createElement('img');
        img.className = 'head-img';
        img.src = `https://mc-heads.net/avatar/${encodeURIComponent(name)}/32`;
        img.title = name;
        img.alt = name;
        img.onerror = function() {
          this.src = 'https://mc-heads.net/avatar/MHF_Steve/32';
        };
        container.appendChild(img);
      });
    }

    // Consulta la API pública de Tebex
    fetch(`https://headless.tebex.io/api/accounts/${PUBLIC_TOKEN}/community-goals`)
      .then(res => res.json())
      .then(data => {
        if (data?.data?.payments?.length > 0) {
          const list = data.data.payments.map(p => p.player?.name || p.username).filter(Boolean);
          renderPlayers(list);
        } else {
          // Si es nueva o de prueba, muestra los últimos registrados
          renderPlayers(['KumaKcher0', 'Steve', 'Alex', 'Notch', 'Grumm', 'Dinnerbone', 'Technoblade']);
        }
      })
      .catch(() => {
        renderPlayers(['KumaKcher0', 'Steve', 'Alex', 'Notch', 'Grumm', 'Dinnerbone', 'Technoblade']);
      });
  </script>
</body>
</html>
